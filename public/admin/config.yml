backend:
  name: git-gateway
  branch: main
  gateway_url: https://monumental-sunburst-4bc155.netlify.app/.netlify/git
  identity_url: https://monumental-sunburst-4bc155.netlify.app/.netlify/identity
site_url: https://quangduc97.github.io/sachhiem.net/
display_url: https://quangduc97.github.io/sachhiem.net/
locale: vi
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: amaritx
    label: Amari-TX (AMARITX)
    label_singular: bài của Amari-TX
    folder: src/pages/AMARITX
    create: true
    nested:
      depth: 100
    editor:
      preview: false
    summary: "{{title}} — {{date}}"
    fields: &a1
      - name: layout
        label: Layout
        widget: hidden
        default: ../../layouts/Article.astro
      - name: title
        label: Tiêu đề
        widget: string
      - name: author
        label: Tác giả (tên ký trong bài)
        widget: string
        required: false
      - name: date
        label: Ngày đăng
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - name: category
        label: Chuyên mục
        widget: select
        required: false
        options:
          - Bài cũ
          - Chính trị
          - Đối thoại
          - Email
          - Khoa học
          - Lịch sử
          - Sách ngoại văn
          - Sách phê bình
          - Tác giả
          - Thời sự
          - Văn hóa
          - Xã hội
      - name: source
        label: Nguồn (link bài gốc)
        widget: string
        required: false
      - name: lang
        label: Ngôn ngữ
        widget: select
        default: vi
        options:
          - label: Tiếng Việt
            value: vi
          - label: Tiếng Anh
            value: en
      - name: image
        label: Ảnh thumbnail (URL)
        widget: string
        required: false
        hint: URL đầy đủ (vd https://pub-xxx.r2.dev/images/...) hoặc dùng nút ảnh để
          upload lên /uploads
      - name: body
        label: Nội dung bài viết
        widget: markdown
  - name: buikha
    label: Bùi Kha (BUIKHA)
    label_singular: bài của Bùi Kha
