<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Quản trị Sách Hiếm</title>
  </head>
  <body>
    <!-- Netlify Identity: cổng đăng nhập cho Decap CMS trên GitHub Pages -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Admin đặt ngoài Netlify (GitHub Pages) nên phải trỏ tường minh
      // về instance Identity của site Netlify.
      window.netlifyIdentity.init({
        APIUrl: 'https://monumental-sunburst-4bc155.netlify.app/.netlify/identity',
      });
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
